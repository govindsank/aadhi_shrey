<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Aadi Kuttah 🕯️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#2a1420; --bg2:#3d1e2c; --rose:#f2a897; --gold:#f0c987;
    --cream:#fbeee2; --ink:#3a1c2b; --card:#fdf3ea; --shadow:rgba(20,8,14,.45);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    font-family:'Quicksand',sans-serif; color:var(--cream); overflow:hidden;
    background:radial-gradient(ellipse at 30% 20%, var(--bg2), var(--bg1) 70%);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100vh; position:relative;
  }
  h1,h2{font-family:'Fraunces',serif; font-weight:600; line-height:1.15;}

  /* ambient glow blobs */
  .glow{position:fixed; border-radius:50%; filter:blur(70px); opacity:.35; pointer-events:none; z-index:0;}
  .glow.a{width:340px; height:340px; background:var(--rose); top:-80px; left:-60px; animation:drift 18s ease-in-out infinite;}
  .glow.b{width:280px; height:280px; background:var(--gold); bottom:-60px; right:-40px; animation:drift 22s ease-in-out infinite reverse;}
  @keyframes drift{0%,100%{transform:translate(0,0);}50%{transform:translate(30px,-25px);}}

  /* floating embers */
  .ember{position:fixed; bottom:-10px; border-radius:50%; background:var(--gold); opacity:0; pointer-events:none; z-index:1;
    animation:rise linear infinite;}
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:.85; }
    90%{ opacity:.5; }
    100%{ transform:translateY(-100vh) translateX(var(--drift,20px)); opacity:0; }
  }

  .screen{
    position:relative; z-index:2; min-height:100vh; width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 20px; text-align:center; transition:opacity .5s ease;
  }
  .hidden{display:none;}

  /* envelope */
  #envelope{cursor:pointer; width:230px; height:150px; position:relative; margin:0 auto 22px;
    filter:drop-shadow(0 18px 30px var(--shadow));}
  .env-body{position:absolute; inset:0; background:linear-gradient(155deg,#f6dfce,#eec9ad); border-radius:8px;}
  .env-flap{position:absolute; top:0; left:0; width:100%; height:78px; background:linear-gradient(160deg,#f0cdb2,#e3b491);
    clip-path:polygon(0 0,100% 0,50% 78%); border-radius:8px 8px 0 0; transform-origin:top; transition:transform .8s cubic-bezier(.6,.05,.2,1); z-index:3;}
  .env-shadow{position:absolute; inset:0; clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%); background:linear-gradient(160deg,#dcb190,#c99873); border-radius:0 0 8px 8px;}
  .seal{position:absolute; top:54px; left:50%; transform:translateX(-50%); font-size:30px; z-index:4; transition:opacity .3s ease .35s;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}
  #envelope.open .env-flap{transform:rotateX(180deg);}
  #envelope.open .seal{opacity:0;}
  .tap-hint{font-size:15px; opacity:.75; letter-spacing:.2px;}
  .tap-hint span{display:inline-block; animation:bob 2.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}

  /* note card */
  .card-wrap{perspective:1200px; width:min(380px,88vw);}
  .card{
    background:var(--card); color:var(--ink); border-radius:18px 18px 20px 20px/22px 22px 24px 24px;
    padding:38px 28px 30px; box-shadow:0 22px 40px var(--shadow);
    display:flex; flex-direction:column; align-items:center; gap:14px;
    transition:transform .45s cubic-bezier(.5,0,.2,1), opacity .45s ease;
  }
  .card.leave-l{transform:translateX(-40px) rotate(-3deg); opacity:0;}
  .card.leave-r{transform:translateX(40px) rotate(3deg); opacity:0;}
  .card-emoji{font-size:38px;}
  .card h2{font-size:23px; font-style:italic;}
  .card p{font-size:15.5px; line-height:1.55; max-width:30ch; opacity:.85;}

  .dots{display:flex; gap:8px; margin:22px 0 18px;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--cream); opacity:.3; cursor:pointer; transition:opacity .3s, transform .3s;}
  .dot.active{opacity:1; transform:scale(1.3);}

  .nav{display:flex; gap:12px; align-items:center;}
  button{font-family:'Quicksand',sans-serif; font-weight:600; border:none; cursor:pointer; border-radius:999px;
    transition:transform .2s ease, box-shadow .2s ease;}
  button:active{transform:scale(.95);}
  .nav-btn{width:44px; height:44px; background:rgba(251,238,226,.12); color:var(--cream); font-size:17px;}
  .nav-btn.primary{width:auto; padding:0 26px; background:linear-gradient(135deg,var(--rose),var(--gold)); color:var(--ink);
    box-shadow:0 10px 22px rgba(240,180,135,.3);}
  .nav-btn.primary:hover{box-shadow:0 12px 26px rgba(240,180,135,.45);}

  /* final screen */
  .final-title{font-size:28px; font-style:italic; max-width:12ch; margin-bottom:10px;}
  .final-sub{font-size:15px; opacity:.75; margin-bottom:30px;}
  .hug-btn{padding:15px 30px; font-size:15.5px; background:linear-gradient(135deg,var(--rose),var(--gold)); color:var(--ink);
    box-shadow:0 12px 26px rgba(240,180,135,.35); margin-bottom:14px;}
  .replay-btn{padding:10px 20px; font-size:13.5px; background:transparent; color:var(--cream); opacity:.65; text-decoration:underline;}

  .heart-pop{position:fixed; z-index:5; pointer-events:none; font-size:20px;
    animation:pop 1.1s ease-out forwards;}
  @keyframes pop{
    0%{ transform:translate(0,0) scale(.6); opacity:1; }
    100%{ transform:translate(var(--dx,0), var(--dy,-120px)) scale(1.1); opacity:0; }
  }

  @media (max-width:360px){ .card{padding:30px 20px 24px;} .final-title{font-size:24px;} }
</style>
</head>
<body>

<div class="glow a"></div>
<div class="glow b"></div>
<div id="embers"></div>

<div class="screen" id="envelope-screen">
  <div id="envelope">
    <div class="env-shadow"></div>
    <div class="env-body"></div>
    <div class="env-flap"></div>
    <div class="seal">🕯️</div>
  </div>
  <p class="tap-hint"><span>Tap to open, Aadi kuttah 🐾</span></p>
</div>

<div class="screen hidden" id="note-screen">
  <div class="card-wrap">
    <div class="card" id="card">
      <div class="card-emoji" id="c-emoji">🐾</div>
      <h2 id="c-title"></h2>
      <p id="c-text"></p>
    </div>
  </div>
  <div class="dots" id="dots"></div>
  <div class="nav">
    <button class="nav-btn" id="prevBtn">←</button>
    <button class="nav-btn primary" id="nextBtn">Next</button>
  </div>
</div>

<div class="screen hidden" id="final-screen">
  <h1 class="final-title">Get well soon, kuttah</h1>
  <p class="final-sub">call me when you're up for it.</p>
  <button class="hug-btn" id="hugBtn">Send a virtual hug 🤗</button><br>
  <button class="replay-btn" id="replayBtn">read that again</button>
</div>

<script>
const notes = [
  {e:'🐾', t:'Hey Aadi Kuttah', x:"just checking in on you."},
  {e:'🥺', t:'Are you okay?', x:"heard you're not feeling too good. how are you doing?"},
  {e:'😔', t:"wish I could be there", x:"can't show up with soup in person, so this'll have to do for now."},
  {e:'👑', t:'ok, princess mode: on', x:"blankets, soup, zero chores. non-negotiable till you're better."},
  {e:'💊', t:'take your meds', x:"on time. don't make me ask twice 😌"},
  {e:'💧', t:'drink water, actually rest', x:"don't scroll your phone all day, just sleep it off."},
  {e:'🫶', t:'call me if you need anything', x:"any time, I mean it."}
];
let i = 0;
const cEmoji = document.getElementById('c-emoji');
const cTitle = document.getElementById('c-title');
const cText  = document.getElementById('c-text');
const card   = document.getElementById('card');
const dotsEl = document.getElementById('dots');

notes.forEach((_,idx)=>{
  const d = document.createElement('div');
  d.className = 'dot' + (idx===0 ? ' active' : '');
  d.addEventListener('click', ()=> goTo(idx));
  dotsEl.appendChild(d);
});

function paint(idx){
  cEmoji.textContent = notes[idx].e;
  cTitle.textContent = notes[idx].t;
  cText.textContent  = notes[idx].x;
  [...dotsEl.children].forEach((d,k)=> d.classList.toggle('active', k===idx));
}
paint(0);

function goTo(target, dir){
  if(target === i) return;
  card.classList.add(dir === 'l' ? 'leave-l' : 'leave-r');
  setTimeout(()=>{
    i = target;
    paint(i);
    card.classList.remove('leave-l','leave-r');
  }, 220);
}

document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(i < notes.length - 1){ goTo(i+1, 'l'); }
  else { showFinal(); }
});
document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(i > 0) goTo(i-1, 'r');
});

const envelope = document.getElementById('envelope');
envelope.addEventListener('click', ()=>{
  envelope.classList.add('open');
  setTimeout(()=>{
    document.getElementById('envelope-screen').classList.add('hidden');
    document.getElementById('note-screen').classList.remove('hidden');
  }, 750);
});

function showFinal(){
  document.getElementById('note-screen').classList.add('hidden');
  document.getElementById('final-screen').classList.remove('hidden');
}
document.getElementById('replayBtn').addEventListener('click', ()=>{
  i = 0; paint(0);
  document.getElementById('final-screen').classList.add('hidden');
  document.getElementById('note-screen').classList.remove('hidden');
});

document.getElementById('hugBtn').addEventListener('click', (e)=>{
  const hearts = ['💖','💗','🤍','💫'];
  const rect = e.target.getBoundingClientRect();
  for(let k=0;k<14;k++){
    const h = document.createElement('div');
    h.className = 'heart-pop';
    h.textContent = hearts[Math.floor(Math.random()*hearts.length)];
    h.style.left = (rect.left + rect.width/2) + 'px';
    h.style.top  = rect.top + 'px';
    h.style.setProperty('--dx', (Math.random()*220-110)+'px');
    h.style.setProperty('--dy', (-(120+Math.random()*140))+'px');
    document.body.appendChild(h);
    setTimeout(()=> h.remove(), 1150);
  }
});

/* ambient embers */
const emberHost = document.getElementById('embers');
for(let k=0;k<16;k++){
  const s = document.createElement('div');
  s.className = 'ember';
  const size = 3 + Math.random()*4;
  s.style.width = size+'px'; s.style.height = size+'px';
  s.style.left = Math.random()*100 + 'vw';
  s.style.setProperty('--drift', (Math.random()*40-20)+'px');
  s.style.animationDuration = (7+Math.random()*8)+'s';
  s.style.animationDelay = (Math.random()*8)+'s';
  emberHost.appendChild(s);
}
</script>
</body>
</html>
